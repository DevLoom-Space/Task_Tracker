{% load static %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'tasks/styles.css' %}">
</head>

<body>
  <div class="nav">
    <div class="nav-inner">
      <div class="brand">
        <div class="brand-badge"></div>
        <a href="{% url 'task_list' %}" style="color: var(--text); text-decoration:none;">Tracker</a>
      </div>

      <div class="nav-links">
        {% if user.is_authenticated %}
          <a class="btn btn-ghost" href="{% url 'dashboard' %}">Dashboard</a>
          <a class="btn" href="{% url 'task_list' %}">Tasks</a>
          <a class="btn" href="{% url 'archived_tasks' %}">Archived</a>
          <a class="btn btn-primary" href="{% url 'task_create' %}">+ New Task</a>
         <form method="post" action="{% url 'logout' %}" style="display:inline;">
  {% csrf_token %}
  <button type="submit" class="btn">Logout</button>
</form>

        {% else %}
          <a class="btn btn-primary" href="{% url 'login' %}">Login</a>
          <a class="btn" href="{% url 'signup' %}">Sign up</a>
        {% endif %}
      </div>
    </div>
  </div>

  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
